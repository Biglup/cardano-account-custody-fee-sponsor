name: Continuous Integration

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardano-account-custody-fee-sponsor
    steps:
      - uses: actions/checkout@v4
        with:
          path: cardano-account-custody-fee-sponsor
      - uses: actions/checkout@v4
        with:
          repository: Biglup/cardano-account-custody-contract
          ref: 393a593d6ed52fbcc5c726f54854a576990b7a6d
          path: cardano-account-custody-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: cardano-account-custody-contract/offchain
      - run: npm run build
        working-directory: cardano-account-custody-contract/offchain
      - run: npm ci
      - run: cmp contract/plutus.json ../cardano-account-custody-contract/plutus.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm test
      - run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: service
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: vars
        run: .github/scripts/vars
      - id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          # The explicit latest line below is the only source of latest, so a
          # release tag never moves it off the newest main commit
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }},enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Place a throwaway .env in the build context, which the image must not carry
        run: printf 'SPONSOR_MNEMONIC=not a mnemonic\n' > .env
      - name: Build the image for the smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sponsor-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke-image.sh sponsor-smoke
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The amd64 smoke above already proves the Dockerfile on a pull
      # request; the arm64 half under QEMU is slow, so it is built only
      # when the result is published
      - name: Build the image for amd64 and arm64 and publish it
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
