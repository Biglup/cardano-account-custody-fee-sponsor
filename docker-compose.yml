#
# Runs the service locally from this checkout: the image built from the
# Dockerfile, configured by the .env file next to this file, with the
# database on a named volume. A deployment runs the published image
# instead; see the Deployment section of the README.

services:
  sponsor:
    build:
      context: .
    env_file: .env
    # A .env written for a run from the working tree names a database path
    # and a port of the host; inside the container the database lives on
    # the volume and the port is the one published below.
    environment:
      DATABASE_PATH: /data/sponsor.sqlite
      PORT: "8787"
    # Published on the loopback address only, so that a local run keeps
    # the admin routes off the LAN.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - sponsor-data:/data
    logging:
      options:
        max-size: "30m"
        max-file: "2"
    restart: unless-stopped

volumes:
  sponsor-data:
